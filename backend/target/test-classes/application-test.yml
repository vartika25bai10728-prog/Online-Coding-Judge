spring:
  application:
    name: apex-judge-backend-test
  datasource:
    url: jdbc:h2:mem:apex_judge_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: c2VjdXJlLXN1cGVyLXNlY3JldC1qd3Qta2V5LWZvci1hcGV4LWp1ZGdlLXByb2R1Y3Rpb24tbXVzdC1iZS0yNTYtYml0cw==
  expiration-ms: 3600000

judge:
  sandbox:
    timeout-ms: 2000
    memory-limit-mb: 128
