<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ApexJudge</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="content" style="display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 440px; margin: 0 auto; padding: 1.5rem;">
      
      <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <h1 style="font-size: 1.6rem; font-weight: 800;">Welcome Back</h1>
          <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">
            Sign in to access your submissions and submit solutions.
          </p>
        </div>

        <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}">
          Invalid credentials
        </div>

        <div th:if="${logoutMessage != null}" class="alert alert-success" th:text="${logoutMessage}">
          Logged out successfully
        </div>

        <div th:if="${registeredMessage != null}" class="alert alert-success" th:text="${registeredMessage}">
          Account registered successfully
        </div>

        <form th:action="@{/login}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="form-group">
            <label class="form-label" for="username">Username or Email</label>
            <input type="text" id="username" name="username" class="form-input" required autofocus placeholder="e.g. admin or alice">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required placeholder="Enter password">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
            Sign In to ApexJudge
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
          Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one now</a>
        </div>
      </div>

      <div class="card" style="padding: 1rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
        <p>Demo Accounts: <code>admin / admin123</code> &bull; <code>alice / password123</code></p>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
