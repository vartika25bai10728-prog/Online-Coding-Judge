<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account - ApexJudge</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="content" style="display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 460px; margin: 0 auto; padding: 1.5rem;">
      
      <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <h1 style="font-size: 1.6rem; font-weight: 800;">Create Competitor Profile</h1>
          <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">
            Join the platform to run test suites and track algorithmic progress.
          </p>
        </div>

        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}">
          Registration error
        </div>

        <form th:action="@{/register}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" required placeholder="Choose a username (min. 3 chars)">
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" required placeholder="name@domain.com">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required placeholder="Create password (min. 6 chars)">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
            Register Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
          Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
        </div>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
