<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Leaderboard - ApexJudge</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="content">
    <div class="container">
      
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.025em;">Global Competitive Standings</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">
          Top rated algorithmic programmers ranked by competitive score and problem mastery.
        </p>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th style="width: 60px;">Rank</th>
                <th>Programmer</th>
                <th>Rating</th>
                <th>Problems Solved</th>
                <th>Current Streak</th>
                <th>Account Role</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(topUsers)}">
                <td colspan="6" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">
                  No competitor records registered yet.
                </td>
              </tr>
              <tr th:each="user, iter : ${topUsers}">
                <td>
                  <span th:if="${iter.count == 1}" style="font-weight: 800; color: #fbbf24;">&#9733; 1</span>
                  <span th:if="${iter.count == 2}" style="font-weight: 800; color: #94a3b8;">&#9733; 2</span>
                  <span th:if="${iter.count == 3}" style="font-weight: 800; color: #b45309;">&#9733; 3</span>
                  <span th:if="${iter.count > 3}" style="color: var(--text-muted); font-family: var(--code-font);" th:text="${iter.count}">4</span>
                </td>
                <td>
                  <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--bg-muted); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; color: var(--primary);" 
                         th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">A</div>
                    <div>
                      <div style="font-weight: 600; color: #fff;" th:text="${user.username}">alice</div>
                      <div style="font-size: 0.75rem; color: var(--text-muted);" th:text="${user.bio != null ? user.bio : 'Competitive Coder'}">bio</div>
                    </div>
                  </div>
                </td>
                <td>
                  <span style="font-weight: 700; color: #60a5fa; font-family: var(--code-font);" th:text="${user.rating}">1500</span>
                </td>
                <td th:text="${user.solvedCount} + ' Solved'">15 Solved</td>
                <td>
                  <span style="color: var(--warning); font-weight: 600;" th:text="'&#128293; ' + ${user.currentStreak} + ' days'">0 days</span>
                </td>
                <td>
                  <span class="badge" style="background: var(--bg-muted); color: var(--text-secondary);" th:text="${user.role}">USER</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
