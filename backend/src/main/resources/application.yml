server:
  port: 8080

spring:
  application:
    name: apex-judge-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/apex_judge_db}
    username: ${SPRING_DATASOURCE_USERNAME:apex_user}
    password: ${SPRING_DATASOURCE_PASSWORD:apex_secure_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:c2VjdXJlLXN1cGVyLXNlY3JldC1qd3Qta2V5LWZvci1hcGV4LWp1ZGdlLXByb2R1Y3Rpb24tbXVzdC1iZS0yNTYtYml0cw==}
  expiration-ms: 86400000

judge:
  sandbox:
    docker-image-python: "python:3.11-alpine"
    docker-image-node: "node:20-alpine"
    docker-image-java: "eclipse-temurin:21-alpine"
    docker-image-cpp: "gcc:13-alpine"
    timeout-ms: 2000
    memory-limit-mb: 256
