version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apex-judge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apex_judge_db
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_user -d apex_judge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apex-judge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-judge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apex_judge_db
      SPRING_DATASOURCE_USERNAME: apex_user
      SPRING_DATASOURCE_PASSWORD: apex_secure_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: c2VjdXJlLXN1cGVyLXNlY3JldC1qd3Qta2V5LWZvci1hcGV4LWp1ZGdlLXByb2R1Y3Rpb24tbXVzdC1iZS0yNTYtYml0cw==
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  redis_data:
